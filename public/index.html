<!doctype html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscolar – Sistema de gestión educativa</title>
<meta name="description" content="Plataforma de inscripción y gestión escolar para instituciones educativas de la República Dominicana.">
<link rel="icon" type="image/x-icon" href="/assets/brand/favicon.ico">

<link rel="manifest" href="/assets/brand/site.webmanifest">
<meta name="theme-color" content="#AF122C">

<!-- F1.2: Tema sin destello – aplicar antes del primer render -->
<script>
(function(){
  var t = localStorage.getItem('ins-theme') || 'system';
  var hc = localStorage.getItem('ins-hc') === '1';
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (t === 'dark' || (t === 'system' && prefersDark)) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  if (hc) document.documentElement.setAttribute('data-hc', '1');
})();
</script>
